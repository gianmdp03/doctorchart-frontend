# Reference static hosting configuration. TLS is configured by the deployment owner.
server {
  listen 80;
  server_name doctorchart.bycode.com.ar localhost;
  root /usr/share/nginx/html;
  include /etc/nginx/mime.types;
  charset utf-8;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Cache-Control no-cache always;
  gzip on;
  gzip_static on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
  error_page 404 /404.html;
  location = /404.html { add_header X-Robots-Tag "noindex, follow" always; }
  location = / { try_files /index.html =404; }
  location = /sin-plan { return 301 /plan-required$is_args$args; }
  location = /admin/especialidades { return 301 /admin/specialties$is_args$args; }
  location = /calendario-vacunacion { return 301 /vaccination-calendar$is_args$args; }
  location = /pacientes { return 301 /patients$is_args$args; }
  location = /pacientes/nuevo { return 301 /patients/new$is_args$args; }
  location = /ficha { return 301 /records$is_args$args; }
  location = /asistente { return 301 /assistant$is_args$args; }
  location = /perfil { return 301 /profile$is_args$args; }
  location = /consultas { return 301 /encounters$is_args$args; }
  location = /calculadoras { return 301 /calculators$is_args$args; }
  location ~ (?:^/(login|sin-plan|perfil|asistente|dashboard|consultas|calendario-vacunacion|calculadoras|pacientes|pacientes/nuevo|ficha|admin/especialidades|onboarding/select-specialty|onboarding/setup)$|^/(pacientes|ficha|consultas)/[^/]+(/editar)?$|^/(login|plan-required|profile|assistant|dashboard|encounters|vaccination-calendar|calculators|patients|patients/new|records|admin/specialties|onboarding/select-specialty|onboarding/setup)$|^/(patients|records|encounters)/[^/]+(/edit)?$) {
    add_header Cache-Control no-cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, follow" always;
    try_files /index.csr.html =404;
  }
  location ~ "[-.][A-Za-z0-9_-]{8,}\.(js|css)$" { add_header Cache-Control "public, max-age=31536000, immutable" always; add_header X-Content-Type-Options nosniff always; try_files $uri =404; }
  location ~ ^(.+)/$ { return 301 $1$is_args$args; }
  location / { try_files $uri =404; }
}
