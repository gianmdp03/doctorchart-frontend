<div class="form-field-group">
  <label for="calciumValueInput" class="form-label">
    <span>Calcio Total Medido</span>
    <span class="text-xs text-rose-500 font-semibold">* Requerido</span>
  </label>
  <div class="input-with-addon">
    <input
      id="calciumValueInput"
      type="number"
      step="0.1"
      min="2"
      max="20"
      placeholder="Ej. 8.2"
      class="form-input"
      [class.border-rose-400]="!form().serumCalciumMgDl()"
      [ngModel]="form().serumCalciumMgDl()"
      (ngModelChange)="form().serumCalciumMgDl.set($event)"
    />
    <span class="input-addon">mg/dL</span>
  </div>
</div>

<div class="form-field-group">
  <label for="albuminValueInput" class="form-label">
    <span>Albúmina Sérica</span>
    <span class="text-xs text-rose-500 font-semibold">* Requerido</span>
  </label>
  <div class="input-with-addon">
    <input
      id="albuminValueInput"
      type="number"
      step="0.1"
      min="0.5"
      max="7"
      placeholder="Ej. 3.0"
      class="form-input"
      [class.border-rose-400]="!form().serumAlbuminGDl()"
      [ngModel]="form().serumAlbuminGDl()"
      (ngModelChange)="form().serumAlbuminGDl.set($event)"
    />
    <span class="input-addon">g/dL</span>
  </div>
</div>
