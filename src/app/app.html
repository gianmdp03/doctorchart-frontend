<app-interaction-status />
@for (sessionKey of sessionKeys(); track sessionKey) {
  @if (isPublicPage() && !authService.isLoggedIn()) {
    <router-outlet />
  } @else {
    @defer (on immediate) {
      <app-private-shell />
    } @placeholder {
      <div class="app-splash-screen" role="status"><p>Cargando DoctorChart…</p></div>
    } @error {
      <div class="app-splash-screen" role="alert"><p>No pudimos cargar DoctorChart. Recargá la página para reintentar.</p></div>
    }
  }
}
<app-scroll-to-top />
