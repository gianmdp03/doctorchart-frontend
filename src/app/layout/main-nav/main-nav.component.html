<nav class="m3-main-nav" aria-label="Navegación principal de módulos">
  <a
    routerLink="/ficha"
    routerLinkActive="tab-active"
    [routerLinkActiveOptions]="{ exact: false }"
    class="m3-tab-item"
  >
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
    </svg>
    <span>Ficha Clínica Integral</span>
  </a>

  <a
    routerLink="/pacientes"
    routerLinkActive="tab-active"
    class="m3-tab-item"
  >
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
    </svg>
    <span>Directorio de Pacientes</span>
  </a>

  @if (isPediatrics()) {
    <a
      routerLink="/curvas"
      routerLinkActive="tab-active"
      class="m3-tab-item"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/>
      </svg>
      <span>Curvas de Crecimiento OMS</span>
    </a>

    <a
      routerLink="/hitos"
      routerLinkActive="tab-active"
      class="m3-tab-item"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
      </svg>
      <span>Ayuda Memoria & Hitos (0-2 años)</span>
    </a>
  }

  @if (isCardiology()) {
    <div class="m3-tab-item" title="Módulo Cardiovascular Activo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      <span>Estratificación Cardiovascular</span>
    </div>
  }
</nav>
