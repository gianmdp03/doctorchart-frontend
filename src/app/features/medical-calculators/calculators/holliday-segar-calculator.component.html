<div class="form-field-group">
  <label for="hollidayWeightInput" class="form-label">
    <span>Peso del Paciente Pediátrico</span>
    <span class="text-xs text-rose-500 font-semibold">* Requerido</span>
  </label>
  <div class="input-with-addon">
    <input
      id="hollidayWeightInput"
      type="number"
      step="0.1"
      min="0.5"
      max="150"
      placeholder="Ej. 14.5"
      class="form-input"
      [class.border-rose-400]="!form().weightKg()"
      [ngModel]="form().weightKg()"
      (ngModelChange)="form().weightKg.set($event)"
    />
    <span class="input-addon">kg</span>
  </div>
  <p class="field-hint">
    Aplica para niños y adolescentes. Regla escalonada: 100 mL/kg (primeros 10kg), 50 mL/kg (10 a
    20kg), y 20 mL/kg (>20kg).
  </p>
</div>
