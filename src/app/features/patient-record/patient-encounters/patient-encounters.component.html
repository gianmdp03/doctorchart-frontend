<section class="tab-panel animate-fade-in" aria-label="Historia Clínica">
  @if (history.pendingDeleteId()) {
    <section class="inline-confirmation" aria-label="Confirmar eliminación de consulta">
      <p>¿Eliminar esta consulta de la historia clínica?</p>
      <button type="button" [disabled]="history.isDeleting()" (click)="history.pendingDeleteId.set(null)">Conservar consulta</button>
      <button type="button" [disabled]="history.isDeleting()" (click)="history.confirmDeleteEncounter()">{{ history.isDeleting() ? 'Eliminando...' : 'Eliminar consulta' }}</button>
    </section>
  }
  @if (history.deleteError(); as message) { <p role="alert">{{ message }}</p> }
  @if (history.isCreatingEncounter()) {
    <app-encounter-form
      [patientId]="patientId()"
      [patientName]="patientName()"
      [previousEncountersCount]="history.encounters().length"
      (cancel)="history.cancelCreatingEncounter()"
      (encounterCreated)="onEncounterCreated($event)"
    />
  } @else {
    <app-clinical-timeline
      [canCreateEncounter]="recordActions.has('NEW_ENCOUNTER')"
      [encounters]="history.encounters()"
      [isLoading]="history.isLoadingEncounters()"
      (newEncounter)="onNewEncounterTriggered()"
      (viewDetail)="history.openEncounterDetail($event)"
      (deleteEncounter)="history.deleteEncounter($event)"
      (printPrescription)="history.onPrintPrescription($event)"
    />
  }
</section>
